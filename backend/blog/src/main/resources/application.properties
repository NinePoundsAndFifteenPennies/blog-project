# Please write comments in English for this configuration file

spring.application.name=blog

# datasource settings
spring.datasource.url=jdbc:mysql://localhost:3306/blog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=437179745

# jpa settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Settings
# JWT secret key (base64 encoded)
app.jwt.secret=DFoin7uuuVzunje2OpBpZBWdTFRKrU0ran1U6zu2fuk3mfRyqzzLUTXvGDZkK1xGg3Xwyz9Eo398H1tpXkjtWA==
# Token expiration time in milliseconds (1 hour)
app.jwt.expiration-ms=3600000
# Remember-me Token expiration time in milliseconds (30 days)
app.jwt.remember-me-expiration-ms=2592000000

# File Upload Settings
file.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Comment Settings
comment.max-nesting-level=3

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
# Redis connection pool settings
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache Configuration (time-to-live in milliseconds)
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# AI basic configuration (Phase 1)
# Available providers: qwen / deepseek / kimi (all are domestic models)
ai.default-provider=qwen
# Qwen (Alibaba Cloud Qianwen/Tongyi) configuration
ai.qwen.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
ai.qwen.model=qwen-plus
# Set in deployment environment: AI_QWEN_API_KEY
ai.qwen.api-key=${AI_QWEN_API_KEY:}
# DeepSeek configuration
ai.deepseek.base-url=https://api.deepseek.com
ai.deepseek.model=deepseek-chat
# Set in deployment environment: AI_DEEPSEEK_API_KEY
ai.deepseek.api-key=${AI_DEEPSEEK_API_KEY:}
# Kimi (Moonshot AI) configuration
ai.kimi.base-url=https://api.moonshot.cn/v1
ai.kimi.model=moonshot-v1-8k
# Set in deployment environment: AI_KIMI_API_KEY
ai.kimi.api-key=${AI_KIMI_API_KEY:}
